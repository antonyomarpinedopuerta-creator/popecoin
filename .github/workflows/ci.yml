name: Local candidate checks
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papa-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        replica: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NO_DNA: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libssl-dev clang build-essential
          rustup toolchain install 1.89.0 --profile minimal --component clippy
          cargo install anchor-cli --version 1.1.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          curl --fail --location --retry 3 https://github.com/anza-xyz/agave/releases/download/v3.1.10/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/solana.tar.bz2"
          # Digest from the official Agave v3.1.10 GitHub release asset metadata.
          echo "a7205ff29bcf0f7199740225ecae2b85a28ea9668892d5ec21bd9749882984a1  $RUNNER_TEMP/solana.tar.bz2" | sha256sum --check --strict
          tar -xjf "$RUNNER_TEMP/solana.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
          npm install --global yarn@1.22.22
      - name: Install locked client dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --production=false
      - name: Audit dependencies against documented findings
        run: npm run audit:dependencies
      - name: Validate local release candidate and isolated Devnet build
        run: npm run check:rc
      - name: Reproduce release with fresh build caches
        run: npm run verify:reproducible
      - name: Verify and package the clean candidate
        run: |
          npm run verify:rc
          npm run package:rc
          npm run verify:package

      - name: Preserve explicit public evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-${{ matrix.replica }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/rc-check.json
            target/reproducibility.json
            target/dependency-audit.json
            target/metadata-local.json
            target/rc/*.tar.gz
            target/rc/*.sha256
  compare:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rc-*
          path: target/runner-evidence
      - name: Compare independent runner inputs and artifacts
        run: python3 scripts/compare-builds.py target/runner-evidence/rc-first/rc-check.json target/runner-evidence/rc-second/rc-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproducibility-comparison
          path: target/ci-comparison.json
          if-no-files-found: error
          retention-days: 30
