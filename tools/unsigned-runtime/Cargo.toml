[package]
name = "robusto-unsigned-runtime"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
solana-program-runtime = { version = "=3.1.14", features = ["agave-unstable-api"] }
solana-bpf-loader-program = { version = "=3.1.14", features = ["agave-unstable-api", "svm-internal"] }
solana-account = "=3.4.0"
solana-instruction = "=3.5.1"
solana-pubkey = "=3.0.0"
solana-clock = "=3.2.1"
solana-sdk-ids = "=3.1.0"
solana-program-pack = "=3.1.0"
spl-token-interface = "=2.0.0"
bincode = "=1.3.3"
sha2 = "=0.10.9"
solana-system-program = { version = "=3.1.14", features = ["agave-unstable-api"] }
solana-rent = "=3.1.0"
solana-svm-callback = { version = "=3.1.14", features = ["agave-unstable-api"] }
solana-svm-log-collector = { version = "=3.1.14", features = ["agave-unstable-api"] }
solana-svm-feature-set = { version = "=3.1.14", features = ["agave-unstable-api"] }
solana-svm-timings = { version = "=3.1.14", features = ["agave-unstable-api"] }
solana-transaction-context = { version = "=3.1.14", features = ["agave-unstable-api"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
